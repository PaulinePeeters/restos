server {
    listen 80;
    server_name _;

    # Autoriser les uploads jusqu'à 50 Mo
    client_max_body_size 50M;

    # Activation de la compression Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Dossier principal contenant le build React
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Evite les 404 de chunks hashés après un déploiement
    # en forçant le navigateur à reprendre un index.html frais.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Les assets versionnés peuvent être fortement cachés.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Gérer le routage React côté client
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy pour l'API Backend
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy pour les fichiers uploadés
    location /uploads/ {
        proxy_pass http://backend:4000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Proxy pour les WebSockets (Socket.io)
    location /socket.io/ {
        proxy_pass http://backend:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
